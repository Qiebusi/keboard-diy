<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>键帽工坊 · Keycap Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c1b1a'/%3E%3Crect x='6' y='6' width='20' height='20' rx='4' fill='%23d9480f'/%3E%3Crect x='10' y='10' width='12' height='12' rx='2.5' fill='%23f4f1ea'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=5">
<style>[v-cloak]{display:none}</style>
</head>
<body>

<div id="app" v-cloak>

<header class="topbar">
  <div class="brand">
    <span class="brand-logo"></span>
    <div class="brand-text">
      <strong>键帽工坊</strong>
      <small class="mono">KEYCAP STUDIO · 1U = 19.05MM</small>
    </div>
  </div>

  <div class="toolbar">
    <label class="field">
      <select :value="state.layoutName" @change="onLayoutChange($event)">
        <option value="60">60% · 61 键</option>
        <option value="75">75% · 87 键</option>
        <option value="tkl">87 键 TKL</option>
        <option value="full">104 键全尺寸</option>
        <option v-if="state.customRows" value="custom">KLE 自定义布局</option>
      </select>
    </label>

    <button class="btn ghost" @click="importKLEClick" title="导入 Keyboard Layout Editor (KLE) JSON 布局">导入 KLE</button>
    <div class="mode-switch" role="group" aria-label="视图模式切换">
      <button :class="{on: state.mode === 'flat'}" @click="setMode('flat')">平面</button>
      <button :class="{on: state.mode === '3d'}" @click="setMode('3d')">3D</button>
    </div>
    <span class="sep"></span>
    <button class="btn" @click="exportBoard">导出整盘</button>
    <button class="btn" @click="exportKey">导出当前键帽</button>
    <span class="sep"></span>
    <button class="btn ghost" @click="saveProject">保存工程</button>
    <button class="btn ghost" @click="loadProjectClick">载入工程</button>
    <button class="btn ghost danger" @click="clearAll">清空</button>
  </div>
</header>

<main class="workspace">
  <section class="canvas-area">
    <div class="canvas-scroll" ref="scrollRef">
      <canvas id="board" ref="boardRef" v-show="state.mode !== '3d'"></canvas>
      <canvas id="board3d" ref="board3dRef" v-show="state.mode === '3d'"></canvas>
    </div>

    <!-- 单键 3D 预览 -->
    <div class="key3d-card" id="key3dCard">
      <div class="key3d-head">
        <span class="tag">单键 3D 预览</span>
        <span class="key3d-actions">
          <button class="btn tiny" @click="zoomOpen">放大</button>
          <button class="btn tiny" :disabled="!hasSel" @click="exportKey3d">导出</button>
        </span>
      </div>
      <div class="key3d-stage" ref="key3dHomeRef">
        <canvas id="key3d" ref="key3dRef" v-show="hasSel"></canvas>
        <div class="key3d-empty" v-show="!hasSel">在键盘中点击一颗键帽<br><small>拖拽旋转 · 滚轮缩放</small></div>
      </div>
    </div>

    <div class="hintbar" v-html="hint"></div>
  </section>

  <aside class="panel" id="panel">
    <div class="panel-empty" v-if="!hasSel">在左侧点击一个键帽开始设计</div>

    <div v-else>
      <div class="key-head">
        <div class="key-title">{{ keyTitle }}</div>
        <div class="key-sub mono">{{ keySub }}</div>
      </div>

      <section class="card">
        <h3 class="mono">键帽 / 图例</h3>
        <div class="row">
          <label class="field grow">
            <span>底色</span>
            <input type="color" :value="curDesign.bg" @input="setCur('bg', $event.target.value)">
          </label>
          <label class="field grow">
            <span>图例颜色</span>
            <div class="color-line">
              <input type="color" :value="curDesign.legendColor || autoLegend" @input="setCur('legendColor', $event.target.value)">
              <button class="btn tiny ghost" @click="legendAuto" title="跟随底色自动配色">自动</button>
            </div>
          </label>
        </div>
        <label class="field">
          <span>图例文字（留空隐藏）</span>
          <input type="text" maxlength="16" placeholder="例如：A / Esc / 自定义" :value="curDesign.legend || ''" @input="setCur('legend', $event.target.value)">
        </label>
        <label class="field">
          <span>图例大小 <b>{{ (curDesign.legendSize || 1).toFixed(2) }}x</b></span>
          <input type="range" min="0.5" max="1.8" step="0.05" :value="curDesign.legendSize || 1" @input="setCur('legendSize', +$event.target.value)">
        </label>
      </section>

      <section class="card">
        <h3 class="mono">图片贴图</h3>
        <div class="upload-zone" id="uploadZone">
          <input type="file" accept="image/*" hidden ref="imgInputRef" @change="onImgFile($event)">
          <button class="btn primary" @click="uploadClick">上传图片</button>
          <small> JPG / PNG / WebP · 自动铺满键帽顶面<br>也可拖入图片或 Ctrl+V 粘贴</small>
        </div>

        <div v-if="curDesign.img">
          <label class="field">
            <span>贴图范围</span>
            <select :value="imgWrapShown" @change="setImg('wrap', $event.target.value)">
              <option value="top">仅顶面</option>
              <option value="net">十字展开包裹（顶面+四壁）</option>
            </select>
          </label>
          <div v-show="netShow">
            <span class="mono">取模预览 · 十字展开</span>
            <canvas id="netPreview" ref="netPreviewRef"></canvas>
          </div>
          <label class="field">
            <span>缩放 <b>{{ (curDesign.img.scale || 1).toFixed(2) }}x</b></span>
            <input type="range" min="0.2" max="4" step="0.01" :value="curDesign.img.scale || 1" @input="setImg('scale', +$event.target.value)">
          </label>
          <label class="field">
            <span>旋转 <b>{{ Math.round(curDesign.img.rot || 0) }}°</b></span>
            <input type="range" min="-180" max="180" step="1" :value="curDesign.img.rot || 0" @input="setImg('rot', +$event.target.value)">
          </label>
          <label class="field">
            <span>水平位置 <b>{{ (curDesign.img.ox || 0).toFixed(2) }}</b></span>
            <input type="range" min="-1" max="1" step="0.01" :value="curDesign.img.ox || 0" @input="setImg('ox', +$event.target.value)">
          </label>
          <label class="field">
            <span>垂直位置 <b>{{ (curDesign.img.oy || 0).toFixed(2) }}</b></span>
            <input type="range" min="-1" max="1" step="0.01" :value="curDesign.img.oy || 0" @input="setImg('oy', +$event.target.value)">
          </label>
          <button class="btn ghost small" @click="removeImg">移除图片</button>
        </div>
      </section>

      <section class="card">
        <h3 class="mono">快捷操作</h3>
        <div class="btn-grid">
          <button class="btn ghost small" @click="applyAll">此设计应用到全部键</button>
          <button class="btn ghost small" @click="resetKey">重置此键</button>
        </div>
      </section>
    </div>

    <section class="card global-card">
      <h3 class="mono">全局</h3>
      <label class="field">
        <span>键帽高度档案（3D）</span>
        <select :value="state.profile" @change="onProfileChange($event)">
          <option value="oem">OEM · 常见机械键盘</option>
          <option value="cherry">Cherry · 原厂低矮</option>
          <option value="sa">SA · 高球帽</option>
          <option value="dsa">DSA · 等高球帽</option>
          <option value="xda">XDA · 等高平顶</option>
        </select>
      </label>
      <label class="field">
        <span>全局键帽颜色</span>
        <input type="color" id="capColorAll" :value="capColorAll" @input="applyGlobalColor($event)">
      </label>
      <label class="field">
        <span>键盘底板颜色</span>
        <input type="color" :value="state.plateColor" @input="state.plateColor = $event.target.value">
      </label>
      <label class="field">
        <span>界面主题</span>
        <select :value="theme" @change="setTheme($event.target.value)">
          <option value="classic">经典 · 暖纸工作台</option>
          <option value="tech">科技 · 暗夜霓虹</option>
        </select>
      </label>
    </section>
  </aside>
</main>

<div class="toast" :class="{show: toastOn}">{{ toastMsg }}</div>
<input type="file" accept=".json,application/json" hidden ref="kleInputRef" @change="onKLEFile($event)">
<input type="file" accept=".json,application/json" hidden ref="projInputRef" @change="onProjFile($event)">

  <!-- 单键 3D 预览放大层 -->
  <div id="key3dOverlay" :class="{show: zoom3d}">
    <div class="key3d-overlay-stage" ref="overlayStageRef"></div>
    <button id="btnZoomClose" class="btn tiny" @click="zoomClose">退出放大 (Esc)</button>
  </div>

</div>

<script src="js/lib/three.min.js?v=16"></script>
<script src="js/lib/vue.global.prod.js?v=1"></script>
<script src="js/layout.js?v=32"></script>
<script src="js/render.js?v=24"></script>
<script src="js/preview3d.js?v=128"></script>
<script src="js/vue-app.js?v=11"></script>
</body>
</html>
